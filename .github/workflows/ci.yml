name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'LICENSE']

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      F1_REQUIRE_SVN: 1 # the SVN importer's tests (ADR-0019)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: sudo apt-get update -q && sudo apt-get install -q -y --no-install-recommends subversion
      - run: make ci

  # External clients: AWS CLI, rclone, mc (phase 4) and Git LFS (phase 6).
  s3tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test/s3tools/install.sh "$RUNNER_TEMP/s3tools"
      - run: PATH="$RUNNER_TEMP/s3tools/bin:$PATH" F1_REQUIRE_S3TOOLS=1 go test ./test -run 'TestS3Tools|TestGitLFS' -v

  # The selected Ceph s3-tests (test/s3tests.txt).
  s3tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: |
          git clone -q https://github.com/ceph/s3-tests.git "$RUNNER_TEMP/s3-tests"
          git -C "$RUNNER_TEMP/s3-tests" checkout -q "$(sed -n 's/^S3TESTS_COMMIT=//p' test/s3tests.sh)"
          pip install -q -r test/s3tests-requirements.txt
      - run: make build && test/s3tests.sh bin/f1d "$RUNNER_TEMP/s3-tests" --timeout=120
