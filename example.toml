# Example f1d configuration. Start with: f1d serve --config example.toml

[server]
# Holds server.db and repos/. Relative paths are resolved against the
# directory of this file.
data_dir = "data"
# Main listener: native API and Git smart HTTP.
listen = "127.0.0.1:8080"

[server.s3]
# S3 API listener; an empty value disables the S3 API.
listen = "127.0.0.1:9000"
region = "us-east-1"
# Virtual-host addressing (<bucket>.<domain>) in addition to path style.
# domain = "s3.example.com"
# Server administrators may create and delete buckets (namespaces).
create_bucket = true
# Open multipart uploads are aborted after this time.
upload_expiry = "168h"
# Expose a namespace's branch as another bucket:
# [[server.s3.alias]]
# bucket    = "design-dev"
# namespace = "design"
# ref       = "heads/dev"

[server.gc]
# Garbage collection of every repository; "0" disables it (f1d gc still
# runs one on demand).
interval = "24h"
# Unreachable objects written this recently are kept (uploads that are not
# committed yet).
grace = "24h"

[log]
level  = "info"   # debug | info | warn | error
format = "text"   # text | json
