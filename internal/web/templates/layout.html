{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · F1</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/">F1</a>
  {{if .User}}
  <nav class="user">
    <span title="{{.User}}">{{.UserName}}</span>
    <form method="post" action="/logout"><button class="link">Sign out</button></form>
  </nav>
  {{end}}
</header>
<main>
{{template "content" .}}
</main>
</body>
</html>
{{end}}
